name: Dukascopy Barrier Discovery v3

on:
  push:
    branches:
      - dukascopy-barrier-v3-20260818
    paths:
      - "tmp_duka_v3/**"
      - ".github/workflows/dukascopy-barrier-v3.yml"
  pull_request:
    branches:
      - main
    paths:
      - "tmp_duka_v3/**"
      - ".github/workflows/dukascopy-barrier-v3.yml"

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout isolated research branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy

      - name: Decode scripts
        run: |
          mkdir -p tmp_duka_v3/work
          curl -L --fail --retry 3 \
            https://raw.githubusercontent.com/dvd1990/autocase/dukascopy-edge-discovery-v1-20260818/tmp_duka_edge_v1/research.py.gz.b64 \
            -o tmp_duka_v3/work/base.py.gz.b64
          base64 --decode tmp_duka_v3/work/base.py.gz.b64 | gzip -dc > tmp_duka_v3/work/duka_base_v1.py
          base64 --decode tmp_duka_v3/barrier_v3.py.gz.b64 | gzip -dc > tmp_duka_v3/work/barrier_v3.py
          python -m py_compile tmp_duka_v3/work/duka_base_v1.py tmp_duka_v3/work/barrier_v3.py
          sha256sum tmp_duka_v3/work/duka_base_v1.py tmp_duka_v3/work/barrier_v3.py

      - name: Run bounded barrier discovery
        run: |
          set -o pipefail
          python tmp_duka_v3/work/barrier_v3.py \
            --base-module tmp_duka_v3/work/duka_base_v1.py \
            --start 2016-01 \
            --end 2026-05 \
            --data-dir tmp_duka_v3/work/data \
            --out-dir tmp_duka_v3/work/results \
            2>&1 | tee tmp_duka_v3/work/run.log

      - name: Print results
        if: always()
        run: |
          echo "===== RUN LOG TAIL ====="
          tail -n 260 tmp_duka_v3/work/run.log 2>/dev/null || true
          echo "===== REPORT ====="
          cat tmp_duka_v3/work/results/REPORT.md 2>/dev/null || true
          echo "===== SUMMARY ====="
          cat tmp_duka_v3/work/results/summary.json 2>/dev/null || true
          echo "===== TRAIN CHAMPIONS ====="
          cat tmp_duka_v3/work/results/train_family_champions.csv 2>/dev/null || true
          echo "===== CONFIRMATION ====="
          cat tmp_duka_v3/work/results/confirmation_results.csv 2>/dev/null || true
          echo "===== LOCKED OOS ====="
          cat tmp_duka_v3/work/results/locked_oos_results.csv 2>/dev/null || true

      - name: Upload research outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dukascopy-barrier-v3-results
          path: |
            tmp_duka_v3/work/run.log
            tmp_duka_v3/work/results
            tmp_duka_v3/work/barrier_v3.py
            tmp_duka_v3/work/duka_base_v1.py
          if-no-files-found: warn
          retention-days: 7
