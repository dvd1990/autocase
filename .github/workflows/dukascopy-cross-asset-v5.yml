name: Dukascopy Cross Asset v5

on:
  push:
    branches:
      - dukascopy-cross-asset-v5-20260818
    paths:
      - "tmp_duka_v5/**"
      - ".github/workflows/dukascopy-cross-asset-v5.yml"
  pull_request:
    branches:
      - main
    paths:
      - "tmp_duka_v5/**"
      - ".github/workflows/dukascopy-cross-asset-v5.yml"

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout isolated research branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip pandas numpy
          mkdir -p tmp_duka_v5/work
          npm --prefix tmp_duka_v5/work install dukascopy-node@1.50.0

      - name: Decode and validate scripts
        run: |
          mkdir -p tmp_duka_v5/work
          base64 --decode tmp_duka_v3/base_v1.py.gz.b64 | gzip -dc > tmp_duka_v5/work/base.py
          cat tmp_duka_v5/parts/part_* > tmp_duka_v5/work/research.py.gz.b64
          test "$(wc -c < tmp_duka_v5/work/research.py.gz.b64)" -eq 8420
          base64 --decode tmp_duka_v5/work/research.py.gz.b64 | gzip -dc > tmp_duka_v5/work/research.py
          base64 --decode tmp_duka_v5/downloader.js.gz.b64 | gzip -dc > tmp_duka_v5/work/downloader.js
          python -m py_compile tmp_duka_v5/work/base.py tmp_duka_v5/work/research.py
          node --check tmp_duka_v5/work/downloader.js
          sha256sum tmp_duka_v5/work/base.py tmp_duka_v5/work/research.py tmp_duka_v5/work/downloader.js

      - name: Download Dukascopy auxiliary daily data
        run: node tmp_duka_v5/work/downloader.js tmp_duka_v5/work/aux

      - name: Run bounded cross-asset research
        run: |
          set -o pipefail
          python tmp_duka_v5/work/research.py \
            --base-module tmp_duka_v5/work/base.py \
            --start 2012-01 \
            --end 2026-05 \
            --xau-data-dir tmp_duka_v5/work/xau_m1 \
            --aux-data-dir tmp_duka_v5/work/aux \
            --out-dir tmp_duka_v5/work/results \
            2>&1 | tee tmp_duka_v5/work/run.log

      - name: Print results
        if: always()
        run: |
          echo "===== RUN LOG TAIL ====="
          tail -n 320 tmp_duka_v5/work/run.log 2>/dev/null || true
          echo "===== REPORT ====="
          cat tmp_duka_v5/work/results/REPORT.md 2>/dev/null || true
          echo "===== SUMMARY ====="
          cat tmp_duka_v5/work/results/summary.json 2>/dev/null || true
          echo "===== DEVELOPMENT TOP 25 ====="
          head -n 26 tmp_duka_v5/work/results/development_grid.csv 2>/dev/null || true
          echo "===== CHAMPIONS ====="
          cat tmp_duka_v5/work/results/frozen_family_champions.csv 2>/dev/null || true
          echo "===== CONFIRMATION ====="
          cat tmp_duka_v5/work/results/confirmation_results.csv 2>/dev/null || true
          echo "===== LOCKED OOS ====="
          cat tmp_duka_v5/work/results/locked_oos_results.csv 2>/dev/null || true

      - name: Upload research outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dukascopy-cross-asset-v5-results
          path: |
            tmp_duka_v5/work/run.log
            tmp_duka_v5/work/results
            tmp_duka_v5/work/research.py
            tmp_duka_v5/work/downloader.js
          if-no-files-found: warn
          retention-days: 7
