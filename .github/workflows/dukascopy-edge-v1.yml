name: Dukascopy Edge Discovery v1

on:
  push:
    branches:
      - dukascopy-edge-discovery-v1-20260818
    paths:
      - "tmp_duka_edge_v1/**"
      - ".github/workflows/dukascopy-edge-v1.yml"
  pull_request:
    branches:
      - main
    paths:
      - "tmp_duka_edge_v1/**"
      - ".github/workflows/dukascopy-edge-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout isolated research branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy

      - name: Recover verified script and allow only terminal partial month
        run: |
          mkdir -p tmp_duka_edge_v1/work
          curl -fsSL "https://raw.githubusercontent.com/dvd1990/autocase/d7644f641c6756f186369dc99cd7d8c74ec08753/tmp_duka_edge_v1/research.py.gz.b64" -o tmp_duka_edge_v1/work/research.py.gz.b64
          base64 --decode tmp_duka_edge_v1/work/research.py.gz.b64 | gunzip > tmp_duka_edge_v1/work/research.py
          echo "ae4b131c6110dc9c815e1e3d3200da192dec0792424ef99417335969818fc614  tmp_duka_edge_v1/work/research.py" | sha256sum -c -
          python - <<'PY'
          from pathlib import Path
          p = Path("tmp_duka_edge_v1/work/research.py")
          s = p.read_text(encoding="utf-8")
          s = s.replace(
              "def ensure_month(data_dir: Path, month: Month, skip_download: bool = False) -> None:\n",
              "def ensure_month(data_dir: Path, month: Month, skip_download: bool = False, allow_partial: bool = False) -> None:\n",
              1,
          )
          s = s.replace(
              "        ok, detail = validate_csv(path, month)\n",
              "        ok, detail = validate_csv(path, month, allow_partial=allow_partial)\n",
              2,
          )
          old = "    months = list(iter_months(args.start, args.end))\n    for i, month in enumerate(months, 1):\n        ensure_month(args.data_dir, month, skip_download=args.skip_download)\n"
          new = "    months = list(iter_months(args.start, args.end))\n    for i, month in enumerate(months, 1):\n        ensure_month(\n            args.data_dir,\n            month,\n            skip_download=args.skip_download,\n            allow_partial=(month == months[-1]),\n        )\n"
          if old not in s:
              raise SystemExit("main loop patch target missing")
          s = s.replace(old, new, 1)
          p.write_text(s, encoding="utf-8")
          PY
          echo "db6d7e24eca8a7b8fc52810d97322f5a766ee4aa1d40f21cd98e8e36db17a5cc  tmp_duka_edge_v1/work/research.py" | sha256sum -c -
          python -m py_compile tmp_duka_edge_v1/work/research.py

      - name: Run bounded edge discovery
        run: |
          set -o pipefail
          python tmp_duka_edge_v1/work/research.py \
            --start 2016-01 \
            --end 2026-06 \
            --data-dir tmp_duka_edge_v1/work/data \
            --out-dir tmp_duka_edge_v1/work/results \
            2>&1 | tee tmp_duka_edge_v1/work/run.log

      - name: Print key outputs
        if: always()
        run: |
          echo "===== RUN LOG TAIL ====="
          tail -n 240 tmp_duka_edge_v1/work/run.log 2>/dev/null || true
          echo "===== SUMMARY ====="
          cat tmp_duka_edge_v1/work/results/summary.json 2>/dev/null || true
          echo "===== REPORT ====="
          cat tmp_duka_edge_v1/work/results/REPORT.md 2>/dev/null || true
          echo "===== SURVIVORS HEAD ====="
          head -n 31 tmp_duka_edge_v1/work/results/survivors_train_validation.csv 2>/dev/null || true
          echo "===== COST STRESS ====="
          cat tmp_duka_edge_v1/work/results/selected_oos_cost_stress.csv 2>/dev/null || true
          echo "===== DISK ====="
          du -sh tmp_duka_edge_v1/work/* 2>/dev/null || true

      - name: Upload research outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dukascopy-edge-discovery-v1-results
          path: |
            tmp_duka_edge_v1/work/run.log
            tmp_duka_edge_v1/work/research.py
            tmp_duka_edge_v1/work/results
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6
