name: Dukascopy Edge Discovery v3

on:
  push:
    branches:
      - dukascopy-edge-discovery-v3-20260818
    paths:
      - "tmp_duka_edge_v3/**"
      - ".github/workflows/dukascopy-edge-v3.yml"
  pull_request:
    branches:
      - main
    paths:
      - "tmp_duka_edge_v3/**"
      - ".github/workflows/dukascopy-edge-v3.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout isolated research branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy

      - name: Reassemble and verify frozen research script
        run: |
          mkdir -p tmp_duka_edge_v3/work
          cat tmp_duka_edge_v3/chunks/part_* > tmp_duka_edge_v3/work/research.py.gz.b64
          echo "0da249c28ff1e24bf4babfc38aaabe2711dbbef269652b583b4f8a871d1e2a9d  tmp_duka_edge_v3/work/research.py.gz.b64" | sha256sum -c -
          base64 --decode tmp_duka_edge_v3/work/research.py.gz.b64 | gunzip > tmp_duka_edge_v3/work/research.py
          echo "cd57931d06fd83fa2ac74f4c66c418f3ed8dcea4e7ea848715930fb752c3ae3e  tmp_duka_edge_v3/work/research.py" | sha256sum -c -
          python -m py_compile tmp_duka_edge_v3/work/research.py

      - name: Run multi-day regime discovery
        run: |
          set -o pipefail
          python tmp_duka_edge_v3/work/research.py \
            --start 2016-01 \
            --end 2026-05 \
            --data-dir tmp_duka_edge_v3/work/data \
            --out-dir tmp_duka_edge_v3/work/results \
            2>&1 | tee tmp_duka_edge_v3/work/run.log

      - name: Print key outputs
        if: always()
        run: |
          echo "===== RUN LOG TAIL ====="
          tail -n 300 tmp_duka_edge_v3/work/run.log 2>/dev/null || true
          echo "===== SUMMARY ====="
          cat tmp_duka_edge_v3/work/results/summary.json 2>/dev/null || true
          echo "===== REPORT ====="
          cat tmp_duka_edge_v3/work/results/REPORT.md 2>/dev/null || true
          echo "===== SURVIVORS HEAD ====="
          head -n 31 tmp_duka_edge_v3/work/results/survivors_train_validation.csv 2>/dev/null || true
          echo "===== CANDIDATES HEAD ====="
          head -n 21 tmp_duka_edge_v3/work/results/all_candidates_train_validation.csv 2>/dev/null || true
          echo "===== CONFIRMATION ====="
          cat tmp_duka_edge_v3/work/results/confirmation_results.csv 2>/dev/null || true
          echo "===== LOCKED OOS ====="
          cat tmp_duka_edge_v3/work/results/locked_oos_results.csv 2>/dev/null || true
          echo "===== DISK ====="
          du -sh tmp_duka_edge_v3/work/* 2>/dev/null || true

      - name: Upload research outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dukascopy-edge-discovery-v3-results
          path: |
            tmp_duka_edge_v3/work/run.log
            tmp_duka_edge_v3/work/research.py
            tmp_duka_edge_v3/work/results
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6
